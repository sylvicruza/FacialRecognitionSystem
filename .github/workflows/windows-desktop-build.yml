name: Build Windows Desktop App

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify Django project
        run: |
          python manage.py check

      - name: Build desktop app
        run: |
          pyinstaller --clean TimeAndAttendance.spec

      - name: Archive portable build
        shell: powershell
        run: |
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          New-Item -ItemType Directory -Path release | Out-Null
          Compress-Archive -Path dist\TimeAndAttendance\* -DestinationPath release\TimeAndAttendance-portable.zip

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "TimeAndAttendanceInstaller.iss"
          Copy-Item "installer_output\TimeAndAttendanceSetup-1.0.0.exe" "release\TimeAndAttendanceSetup-1.0.0.exe"

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: time-and-attendance-windows
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TimeAndAttendance-portable.zip
            release/TimeAndAttendanceSetup-1.0.0.exe
          generate_release_notes: true
