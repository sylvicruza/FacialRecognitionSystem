name: Build Windows Desktop App

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Resolve build version
        id: version
        shell: powershell
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            $version = "0.0.0-${{ github.run_number }}"
          }
          "app_version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify Django project
        run: |
          python manage.py check

      - name: Build desktop app
        run: |
          pyinstaller --clean TimeAndAttendance.spec

      - name: Archive portable build
        shell: powershell
        run: |
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          New-Item -ItemType Directory -Path release | Out-Null
          Compress-Archive -Path dist\TimeAndAttendance.exe -DestinationPath release\TimeAndAttendance-portable-${{ steps.version.outputs.app_version }}.zip
          Copy-Item "release\TimeAndAttendance-portable-${{ steps.version.outputs.app_version }}.zip" "release\TimeAndAttendance-portable-latest.zip"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.app_version }}" "TimeAndAttendanceInstaller.iss"
          Copy-Item "installer_output\TimeAndAttendanceSetup-${{ steps.version.outputs.app_version }}.exe" "release\TimeAndAttendanceSetup-${{ steps.version.outputs.app_version }}.exe"
          Copy-Item "installer_output\TimeAndAttendanceSetup-${{ steps.version.outputs.app_version }}.exe" "release\TimeAndAttendanceSetup-latest.exe"

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: time-and-attendance-windows
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TimeAndAttendance-portable-${{ steps.version.outputs.app_version }}.zip
            release/TimeAndAttendance-portable-latest.zip
            release/TimeAndAttendanceSetup-${{ steps.version.outputs.app_version }}.exe
            release/TimeAndAttendanceSetup-latest.exe
          generate_release_notes: true
